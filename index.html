<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home – Bill Buddy</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* LOGO */
    .logo {
      /* position: absolute; */
      /* top: 20px;
      left: 20px; */
      width: 240px;
    }

    .container {
      text-align: center;
      margin-top: 150px;
    }

    h1 {
      margin-top: -50px;
      font-size: 60px;
      margin-bottom: 10px;
    }

    .clickable {
      font-size: 20px;
      color: #818181;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      padding: 5px;
    }

    .clickable:hover {
      color: #1e1e1e;
      background: #656565;
      /* text-decoration: underline; */
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .canvas img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    .popup {
      position: absolute;
      bottom: -90%;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 600px;
      background: #fff;
      color: #000;
      padding: 35px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
      transition: bottom 0.6s ease-out, opacity 0.3s ease;
      opacity: 0;
      border-radius: 4px;
      font-family: "Times New Roman", serif;
      overflow-y: auto;
    }

    .popup.active {
      bottom: 40px;
      opacity: 1;
    }

    .popup h2 {
      margin-top: 0;
    }

    .popup li {
      margin-bottom: 8px;
    }

    .popup small {
      color: #333;
    }

    .popup button {
      margin-right: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .fake-signature {
      font-family: cursive;
      font-size: 22px;
      margin-left: 10px;
    }

    .final-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: bold;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 20px #000;
    }
  </style>
</head>

<body>


  <div class="container">
    <img src="assets/BillBuddy_Logo.png" class="logo">
    <h1>Bill Buddy</h1>
    <button class="clickable" onclick="goToCanvas()">THIS DEAL WILL HAPPEN</button>
  </div>

  <script>
    function goToCanvas() {
      document.body.innerHTML = `
        <div class="canvas">
          <img id="contractImage" src="assets/contract.png" onclick="swapImage()" />
        </div>
      `;
    }

    function popUp(){
      const canvas = document.querySelector(".canvas");

      const popup = document.createElement("div");
      popup.classList.add("popup");
      popup.id = "contractPopup";

      popup.innerHTML = `
        <h2>Contract Agreement</h2>
        <p>This agreement confirms the terms of the deal presented to you.</p>
        <ol>
          <li>The initial service fee is presented at the point of agreement and reflects current promotional pricing.</li>
          <li>Introductory rates apply for a limited period and may be subject to review upon completion of the initial term.</li>
          <li>Where applicable, fixed pricing will remain in effect unless amended under standard account conditions.</li>
          <li>Users are encouraged to review all applicable fees, service terms, and usage policies before confirming.</li>
        </ol>
        <p><small>All services are provided in accordance with standard usage policies. Continued access may be subject to routine account checks.</small></p>
        <button onclick="agreeTerms()">Agree</button>
        <button onclick="disagreeTerms1()">Disagree</button>
        <br><br>
        <p id="signatureLine"><strong>Signature:</strong> ____________________</p>
      `;

      canvas.appendChild(popup);
      setTimeout(() => popup.classList.add("active"), 50);
    }

    function swapImage() {
      const img = document.getElementById("contractImage");
      img.src = "assets/presented.png";
      img.onclick = null;

      setTimeout(popUp, 300);
    }

    function disagreeTerms1(){
      const img = document.getElementById("contractImage");
      const popup = document.getElementById("contractPopup");

      img.src = "assets/revisit.png";
      img.onclick = revisitOffer;

      popup.classList.remove("active");
      setTimeout(() => popup.remove(), 600);
    }

    function revisitOffer() {
      const img = document.getElementById("contractImage");

      img.src = "assets/contract.png";
      img.onclick = null;

      setTimeout(popUpWorseDeal, 300);
    }

    function popUpWorseDeal(){
      const canvas = document.querySelector(".canvas");

      const popup = document.createElement("div");
      popup.classList.add("popup");
      popup.id = "contractPopup";

      popup.innerHTML = `
        <h2>Updated Agreement</h2>
        <p>We have adjusted the terms to better match your selected preference.</p>
        <ol>
          <li>Service access is provided under a fair usage framework; additional charges may apply where limits are exceeded.</li>
          <li>Introductory pricing may be adjusted following the initial period in line with current service rates.</li>
          <li>Automatic renewal is enabled to ensure uninterrupted access unless cancelled in advance of the billing cycle.</li>
          <li>Administrative and processing fees may be applied where applicable.</li>
          <li>Users are responsible for reviewing all updated terms, including any changes to pricing or service conditions.</li>
        </ol>
        <p><small>Continued use of the service constitutes acceptance of any updated terms.</small></p>
        <button onclick="agreeTerms()">Agree</button>
        <button onclick="disagreeTerms2()">Disagree</button>
        <br><br>
        <p id="signatureLine"><strong>Signature:</strong> ____________________</p>
      `;

      canvas.appendChild(popup);
      setTimeout(() => popup.classList.add("active"), 50);
    }

    function disagreeTerms2(){
      const img = document.getElementById("contractImage");
      const popup = document.getElementById("contractPopup");

      img.src = "assets/contract.png";
      img.onclick = null;

      popup.classList.remove("active");

      setTimeout(() => {
        popup.remove();
        setTimeout(popUpFinalDeal, 200);
      }, 600);
    }

    function popUpFinalDeal(){
      const canvas = document.querySelector(".canvas");

      const popup = document.createElement("div");
      popup.classList.add("popup");
      popup.id = "contractPopup";

      popup.innerHTML = `
        <h2>Final Agreement</h2>
        <p>Your request has been processed. The following terms now apply:</p>
        <ol>
          <li>All charges, including recurring and supplementary fees, will be applied automatically to the registered account.</li>
          <li>Fair usage limitations may restrict access while billing remains active.</li>
          <li>Automatic renewal will extend the agreement indefinitely unless terminated in accordance with administrative approval procedures.</li>
          <li>Introductory or promotional pricing may be withdrawn or revised without prior notice.</li>
          <li>Termination requests are subject to processing, review, and applicable administrative conditions.</li>
          <li>By agreeing, the user accepts full responsibility for all current and future charges associated with the service.</li>
        </ol>
        <p><small>This agreement supersedes all prior representations, terms, and expectations.</small></p>

        <button onclick="agreeTerms()">Agree</button>

        <br><br>
        <p id="signatureLine"><strong>Signature:</strong> ____________________</p>
      `;

      canvas.appendChild(popup);
      setTimeout(() => popup.classList.add("active"), 50);
    }

    function goToSpam(){
      location.href = "spam.html";
    }

    function agreeTerms(){
      const popup = document.getElementById("contractPopup");
      const signatureLine = document.getElementById("signatureLine");

      signatureLine.innerHTML = `
        <strong>Signature:</strong>
        <span class="fake-signature">Billy B.</span>
      `;

      setTimeout(() => {
        popup.classList.remove("active");

        setTimeout(() => {
          popup.remove();

          const img = document.getElementById("contractImage");
          const canvas = document.querySelector(".canvas");

          img.src = "assets/presented.png";
          img.onclick = null;

          const message = document.createElement("div");
          message.classList.add("final-message");
          message.innerText = "Pleasure doing business with you, you fool";

          canvas.appendChild(message);

          setTimeout(goToSpam, 5000);
        }, 600);
      }, 900);
    }
  </script>

</body>
</html>
